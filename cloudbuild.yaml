# Cloud Build CI/CD Pipeline for Investment Due Diligence AI
# Triggered on: push to main branch or pull requests

steps:
  # Step 1: Build Backend Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/investment-dd-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/investment-dd-backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - './backend'

  # Step 2: Build Frontend Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/investment-dd-frontend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/investment-dd-frontend:latest'
      - '-f'
      - 'frontend/Dockerfile'
      - './frontend'

  # Step 3: Run Backend Tests (optional - add when you have tests)
  # - name: 'gcr.io/cloud-builders/docker'
  #   id: 'test-backend'
  #   args:
  #     - 'run'
  #     - '--rm'
  #     - 'gcr.io/$PROJECT_ID/investment-dd-backend:$COMMIT_SHA'
  #     - 'pytest'
  #     - 'tests/'
  #   waitFor: ['build-backend']

  # Step 4: Security Scan (optional)
  # - name: 'gcr.io/cloud-builders/gcloud'
  #   id: 'scan-backend'
  #   args:
  #     - 'container'
  #     - 'images'
  #     - 'scan'
  #     - 'gcr.io/$PROJECT_ID/investment-dd-backend:$COMMIT_SHA'
  #   waitFor: ['build-backend']

  # Step 5: Push Backend Image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/investment-dd-backend'
    waitFor: ['build-backend']

  # Step 6: Push Frontend Image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/investment-dd-frontend'
    waitFor: ['build-frontend']

  # Step 7: Deploy Backend to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-backend'
    args:
      - 'run'
      - 'deploy'
      - 'investment-dd-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/investment-dd-backend:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'OPENAI_API_KEY=${_OPENAI_API_KEY},PERPLEXITY_API_KEY=${_PERPLEXITY_API_KEY},TAVILY_API_KEY=${_TAVILY_API_KEY}'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'
    waitFor: ['push-backend']

  # Step 8: Deploy Frontend to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-frontend'
    args:
      - 'run'
      - 'deploy'
      - 'investment-dd-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/investment-dd-frontend:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'BACKEND_URL=${_BACKEND_URL}'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--max-instances'
      - '5'
    waitFor: ['push-frontend', 'deploy-backend']

  # Step 9: Run Smoke Tests (optional)
  # - name: 'gcr.io/cloud-builders/curl'
  #   id: 'smoke-test'
  #   args:
  #     - '-f'
  #     - 'https://investment-dd-backend-${_REGION}.run.app/health'
  #   waitFor: ['deploy-backend']

# Substitution variables (set in trigger or provide defaults)
substitutions:
  _REGION: 'europe-west1'
  _BACKEND_URL: 'https://investment-dd-backend-europe-west1.run.app'
  # Secrets should be stored in Secret Manager, not here
  _OPENAI_API_KEY: ''
  _PERPLEXITY_API_KEY: ''
  _TAVILY_API_KEY: ''

# Store images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/investment-dd-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/investment-dd-backend:latest'
  - 'gcr.io/$PROJECT_ID/investment-dd-frontend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/investment-dd-frontend:latest'

# Build configuration
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  
# Timeout for entire build
timeout: '1800s'
