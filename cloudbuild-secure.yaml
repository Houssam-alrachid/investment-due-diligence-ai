# Secure Cloud Build Pipeline using Secret Manager
# This version pulls secrets from Secret Manager instead of substitution variables

steps:
  # Step 1: Build Backend Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/investment-dd-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/investment-dd-backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - './backend'

  # Step 2: Build Frontend Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/investment-dd-frontend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/investment-dd-frontend:latest'
      - '-f'
      - 'frontend/Dockerfile'
      - './frontend'

  # Step 3: Push Images
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/investment-dd-backend']
    waitFor: ['build-backend']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/investment-dd-frontend']
    waitFor: ['build-frontend']

  # Step 4: Deploy Backend with Secret Manager
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-backend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy investment-dd-backend \
          --image gcr.io/$PROJECT_ID/investment-dd-backend:$COMMIT_SHA \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --set-secrets OPENAI_API_KEY=openai-api-key:latest,PERPLEXITY_API_KEY=perplexity-api-key:latest,TAVILY_API_KEY=tavily-api-key:latest \
          --memory 2Gi \
          --cpu 2 \
          --timeout 300 \
          --max-instances 10 \
          --min-instances 0
    waitFor: ['push-backend']

  # Step 5: Get Backend URL
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'get-backend-url'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run services describe investment-dd-backend \
          --region ${_REGION} \
          --format 'value(status.url)' > /workspace/backend_url.txt
    waitFor: ['deploy-backend']

  # Step 6: Deploy Frontend
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-frontend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        BACKEND_URL=$(cat /workspace/backend_url.txt)
        gcloud run deploy investment-dd-frontend \
          --image gcr.io/$PROJECT_ID/investment-dd-frontend:$COMMIT_SHA \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars BACKEND_URL=$${BACKEND_URL} \
          --memory 512Mi \
          --cpu 1 \
          --max-instances 5
    waitFor: ['push-frontend', 'get-backend-url']

substitutions:
  _REGION: 'europe-west1'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/openai-api-key/versions/latest
      env: 'OPENAI_API_KEY'
    - versionName: projects/$PROJECT_ID/secrets/perplexity-api-key/versions/latest
      env: 'PERPLEXITY_API_KEY'
    - versionName: projects/$PROJECT_ID/secrets/tavily-api-key/versions/latest
      env: 'TAVILY_API_KEY'

images:
  - 'gcr.io/$PROJECT_ID/investment-dd-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/investment-dd-backend:latest'
  - 'gcr.io/$PROJECT_ID/investment-dd-frontend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/investment-dd-frontend:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  
timeout: '1800s'
