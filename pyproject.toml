[project]
name = "investment-due-diligence-ai"
version = "1.0.0"
description = "AI-powered investment due diligence system with FastAPI backend and modern web frontend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "openai-agents>=0.0.15",
    "sendgrid>=6.11.0",
    "python-multipart>=0.0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[dependency-groups]
dev = []
