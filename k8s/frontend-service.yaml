# ============================================================================
# SERVICE - Frontend (LoadBalancer)
# ============================================================================
# Service externe pour le frontend
# Type LoadBalancer: accessible depuis l'extérieur du cluster
# Minikube créera un tunnel pour simuler un LoadBalancer
# ============================================================================

apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: investment-ai
  labels:
    app: investment-due-diligence
    component: frontend
spec:
  # Type de service: LoadBalancer (expose à l'extérieur)
  type: LoadBalancer
  
  # Sélecteur: route le trafic vers les pods frontend
  selector:
    app: investment-due-diligence
    component: frontend
  
  # Ports exposés
  ports:
  - name: http
    port: 80          # Port du service (externe)
    targetPort: 80    # Port du conteneur Nginx
    protocol: TCP
  
  sessionAffinity: None
